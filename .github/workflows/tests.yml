name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} transition tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Collect all current tests
        run: python -m pytest --collect-only -q

      - name: Test current transition API
        run: >
          python -m pytest
          tests/test_events.py
          tests/test_states.py
          tests/test_transition.py
          tests/test_state_occurrence.py
          tests/test_state_contract.py
          --cov=featuregraph
          --cov-report=term-missing

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build frontend
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test wheel
        run: |
          python -m venv /tmp/featuregraph-wheel-test
          /tmp/featuregraph-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/featuregraph-wheel-test/bin/python -c "import featuregraph; assert featuregraph.__version__ == '0.2.0b1'"

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

# The main branch is the unreleased transition-centered successor. Its notebooks
# are development artifacts and are not yet a reproducible CI gate. The alpha
# branch retains the legacy notebook and oscillation/accumulation validation.
