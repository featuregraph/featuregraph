<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeatureGraph Research Assistant</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17212b;
      --muted: #66717d;
      --line: #dce3e8;
      --paper: #ffffff;
      --wash: #f4f7f8;
      --blue: #125ca8;
      --blue-dark: #0a477f;
      --green: #167a59;
      --assistant: #edf4fa;
      --researcher: #1d5c91;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(150deg, #eef4f7 0%, #f9faf8 55%, #edf4f0 100%);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      width: min(980px, calc(100% - 28px));
      min-height: calc(100vh - 28px);
      margin: 14px auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(21, 47, 65, .12);
    }
    main { min-width: 0; display: flex; flex-direction: column; }
    header {
      padding: 22px 26px 18px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 13px; }
    .mode {
      padding: 7px 10px;
      border-radius: 999px;
      background: #e9f6f1;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    #messages {
      flex: 1;
      min-height: 520px;
      max-height: calc(100vh - 190px);
      overflow-y: auto;
      padding: 28px 26px;
    }
    .message { display: flex; margin: 0 0 20px; }
    .message.user { justify-content: flex-end; }
    .bubble {
      max-width: 78%;
      padding: 14px 16px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .assistant .bubble { background: var(--assistant); border-top-left-radius: 4px; }
    .user .bubble { background: var(--researcher); color: white; border-top-right-radius: 4px; }
    .composer {
      border-top: 1px solid var(--line);
      padding: 18px 22px;
      background: #fbfcfc;
    }
    .input-row { display: flex; gap: 10px; }
    textarea {
      width: 100%;
      resize: none;
      border: 1px solid #cfd9df;
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      min-height: 48px;
      max-height: 130px;
      outline: none;
      background: white;
    }
    textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(18, 92, 168, .12); }
    button {
      border: 0;
      border-radius: 11px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--blue);
      color: white;
    }
    button:hover { background: var(--blue-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    #approve {
      width: 100%;
      min-height: 44px;
      margin-top: 10px;
      background: var(--green);
      display: none;
    }
    aside {
      padding: 24px 18px;
      background: var(--wash);
      border-left: 1px solid var(--line);
    }
    aside h2 { margin: 0 0 6px; font-size: 14px; }
    .phase { color: var(--muted); font-size: 12px; margin-bottom: 22px; }
    #artifacts { display: flex; flex-direction: column; gap: 9px; }
    .artifact {
      display: block;
      padding: 10px 11px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--blue-dark);
      font-size: 12px;
      font-weight: 650;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .artifact:hover { border-color: #9ab6ca; }
    .empty { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .error { margin: 8px 0 0; color: #a22b2b; font-size: 12px; }
    @media (max-width: 740px) {
      .shell { display: block; width: 100%; min-height: 100vh; margin: 0; border: 0; border-radius: 0; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      #messages { min-height: 420px; max-height: none; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <header>
        <div>
          <h1>FeatureGraph Research Assistant</h1>
          <div class="subtitle">Conversation → approved specification → deterministic study</div>
        </div>
        <div class="mode" id="mode">Loading…</div>
      </header>
      <section id="messages" aria-live="polite"></section>
      <section class="composer">
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="Describe your research question…"></textarea>
          <button id="send">Send</button>
        </div>
        <button id="approve">Approve and run</button>
        <div class="error" id="error"></div>
      </section>
    </main>
    <aside>
      <h2>Study record</h2>
      <div class="phase" id="phase">Starting session…</div>
      <div id="artifacts"><div class="empty">Artifacts will appear as the conversation progresses.</div></div>
    </aside>
  </div>
  <script>
    const messages = document.querySelector('#messages');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const approve = document.querySelector('#approve');
    const artifacts = document.querySelector('#artifacts');
    const phase = document.querySelector('#phase');
    const mode = document.querySelector('#mode');
    const errorBox = document.querySelector('#error');

    function renderMessages(items) {
      messages.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = `message ${item.role === 'user' ? 'user' : 'assistant'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = item.content;
        row.appendChild(bubble);
        messages.appendChild(row);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    function renderArtifacts(items) {
      if (!items || !items.length) {
        artifacts.innerHTML = '<div class="empty">Artifacts will appear as the conversation progresses.</div>';
        return;
      }
      artifacts.innerHTML = '';
      items.forEach(item => {
        const link = document.createElement('a');
        link.className = 'artifact';
        link.textContent = item.label;
        link.href = `/artifacts/${encodeURIComponent(item.path)}`;
        link.target = '_blank';
        link.rel = 'noreferrer';
        artifacts.appendChild(link);
      });
    }

    function applyState(state) {
      if (state.messages) renderMessages(state.messages);
      if (state.artifacts) renderArtifacts(state.artifacts);
      phase.textContent = `Phase: ${String(state.phase).replaceAll('_', ' ')}`;
      approve.style.display = state.can_approve ? 'block' : 'none';
      if (state.assistant_mode) mode.textContent = state.assistant_mode;
    }

    async function request(path, body) {
      send.disabled = true;
      approve.disabled = true;
      errorBox.textContent = '';
      try {
        const response = await fetch(path, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body || {})
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || 'Request failed');
        const state = await fetch('/api/state').then(value => value.json());
        applyState(state);
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        send.disabled = false;
        approve.disabled = false;
        input.focus();
      }
    }

    send.addEventListener('click', () => {
      const value = input.value.trim();
      if (!value) return;
      input.value = '';
      request('/api/message', {message: value});
    });
    approve.addEventListener('click', () => request('/api/approve'));
    input.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send.click();
      }
    });

    fetch('/api/state').then(response => response.json()).then(applyState);
  </script>
</body>
</html>
